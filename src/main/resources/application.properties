spring.application.name=baas-platform
server.port=${PORT:8080}
# Hosts like Render end TLS in front of the app; trust their X-Forwarded-* headers so MCP returns https URLs
server.forward-headers-strategy=framework

# Secrets come from environment variables or a local .env file (see .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baas_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Set BAAS_MAIL_ENABLED=false to turn off /email/send and the OTP routes (no mail account needed)
baas.mail.enabled=${BAAS_MAIL_ENABLED:true}
